name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Select release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *) printf 'release tag must start with v: %s\n' "$RELEASE_TAG" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify local release assets
        run: |
          set -euo pipefail
          BINARY=llmhub scripts/verify-release-assets.sh dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "$RELEASE_TAG" \
            --notes "Release for $RELEASE_TAG."
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true

      - name: Upload and verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for os in linux darwin windows freebsd; do
            for arch in amd64 arm64; do
              case "$os/$arch" in
                windows/amd64) target=${os}_${arch}_v1; filename=llmhub.exe; asset=llmhub-$os-$arch.exe ;;
                windows/arm64) target=${os}_${arch}_v8.0; filename=llmhub.exe; asset=llmhub-$os-$arch.exe ;;
                */amd64) target=${os}_${arch}_v1; filename=llmhub; asset=llmhub-$os-$arch ;;
                */arm64) target=${os}_${arch}_v8.0; filename=llmhub; asset=llmhub-$os-$arch ;;
                *) printf 'unsupported release target: %s/%s\n' "$os" "$arch" >&2; exit 1 ;;
              esac
              artifact="dist/llmhub_$target/$filename"
              test -f "$artifact"
              # gh release upload names assets after the file's basename, so
              # upload through a unique per-target name (the FILE#LABEL syntax
              # only sets the display label, not the asset name).
              cp "$artifact" "$RUNNER_TEMP/$asset"
              gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$asset"
            done
          done
          gh release upload "$RELEASE_TAG" 'dist/checksums.txt'
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 9
          remote_dir="$RUNNER_TEMP/llmhub-release-assets"
          mkdir -p "$remote_dir"
          gh release download "$RELEASE_TAG" --dir "$remote_dir"
          BINARY=llmhub scripts/verify-release-assets.sh "$remote_dir"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false
