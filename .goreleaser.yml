version: 2

before:
  hooks:
    - sh -c 'cd web && bun install'
    - sh -c 'cd web && bun run build'
    - mkdir -p internal/managementasset/static
    - cp web/dist/index.html internal/managementasset/static/management.html

builds:
  - id: "llmhub"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    main: ./cmd/server/
    binary: llmhub
    ldflags:
      - -s -w -X 'main.Version={{.Version}}' -X 'main.Commit={{.ShortCommit}}' -X 'main.BuildDate={{.Date}}'
archives:
  - id: "llmhub"
    formats:
      - binary
    name_template: 'llmhub-{{ .Os }}-{{ .Arch }}'

checksum:
  name_template: 'checksums.txt'

binary_signs:
  - id: "minisign"
    artifacts: binary
    signature: "${artifact}.minisig"
    cmd: ./scripts/sign-release-asset.sh
    args:
      - --artifact
      - "${artifact}"
      - --signature
      - "${signature}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
