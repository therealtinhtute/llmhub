services:
  llmhub:
    image: ${LLMHUB_IMAGE:-eceasy/llmhub:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: llmhub-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ./home:/root/.llmhub
      - ./logs:/LLMHub/logs
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./LLMHub -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
