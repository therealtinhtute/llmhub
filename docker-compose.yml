services:
  llmhub:
    image: ${LLMHUB_IMAGE:-eceasy/llmhub:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: llmhub
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${LLMHUB_CONFIG_PATH:-./config.yaml}:/LLMHub/config.yaml
      - ${LLMHUB_AUTH_PATH:-./auths}:/root/.llmhub
      - ${LLMHUB_LOG_PATH:-./logs}:/LLMHub/logs
    restart: unless-stopped
