services:
  llmhub:
    image: ${LLMHUB_IMAGE:-eceasy/llmhub:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: llmhub
    # Prefer LLMHUB_INIT_CONFIG_B64 in .env for first boot.
    env_file:
      - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    command:
      - /bin/sh
      - -lc
      - ./LLMHub init-db-from-env && exec ./LLMHub
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    restart: unless-stopped
